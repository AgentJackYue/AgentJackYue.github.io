<link rel="stylesheet" href="{{ '/assets/css/image.css' | relative_url }}">

<figure class="post-image">
  <img
    src="{{ include.src | relative_url }}"
    alt="{{ include.alt | escape }}"
    {% if include.width %}
      style="width: {{ include.width }}; border-radius: 10px;"
    {% endif %}
  >

  {% if include.caption %}
    <figcaption>{{ include.caption }}</figcaption>
  {% endif %}
</figure>
